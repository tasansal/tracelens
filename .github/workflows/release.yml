name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (native aarch64)
            args: '--target aarch64-apple-darwin'
          - platform: macos-13 # Intel (native x86_64)
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04 # AppImage + deb (glibc 2.35 floor)
            args: ''
          - platform: windows-latest # NSIS
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # Each leg builds the runner's native arch, so the host toolchain's default
      # target is sufficient — no `targets:` needed (matches ci.yml).
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # In a parallel matrix, tauri-action fetches the release's existing
      # latest.json, merges this leg's platform entry, and re-uploads it — so the
      # final draft release carries a multi-platform updater manifest.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TraceLens ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `tracelens_*_aarch64.dmg` |
            | macOS (Intel) | `tracelens_*_x64.dmg` |
            | Windows 10/11 | `tracelens_*_x64-setup.exe` |
            | Linux (universal) | `tracelens_*_amd64.AppImage` |
            | Linux (Debian/Ubuntu) | `tracelens_*_amd64.deb` |
            | Linux (Rocky/RHEL/Fedora) | `tracelens_*_amd64.flatpak` |

            The app is unsigned: macOS users right-click → **Open**; Windows users
            click **More info → Run anyway**.

            <details><summary>Updater files</summary>

            `latest.json` and the `*.sig` files power the in-app auto-updater
            (macOS / Windows / AppImage). You do not need to download them manually.

            </details>
