id: com.tracelens.desktop
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: tracelens

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=host

modules:
  - name: tracelens
    buildsystem: simple
    sources:
      - type: file
        path: ../tracelens.deb
      - type: file
        path: com.tracelens.desktop.metainfo.xml
      - type: file
        path: com.tracelens.desktop.mime.xml
    build-commands:
      - mkdir -p deb-extract
      - ar -x tracelens.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.*
      - install -Dm755 deb-extract/usr/bin/tracelens /app/bin/tracelens
      - install -Dm644 deb-extract/usr/share/applications/tracelens.desktop /app/share/applications/com.tracelens.desktop.desktop
      - sed -i 's/^MimeType=.*/MimeType=application\/x-segy;/' /app/share/applications/com.tracelens.desktop.desktop || true
      - grep -q '^MimeType=' /app/share/applications/com.tracelens.desktop.desktop || echo 'MimeType=application/x-segy;' >> /app/share/applications/com.tracelens.desktop.desktop
      - sed -i 's/^Icon=.*/Icon=com.tracelens.desktop/' /app/share/applications/com.tracelens.desktop.desktop
      # appstreamcli compose (flatpak-builder 1.4+) requires a Freedesktop
      # main category. Tauri's .desktop often has none.
      - sed -i 's/^Categories=.*/Categories=Science;Geoscience;Viewer;/' /app/share/applications/com.tracelens.desktop.desktop || true
      - grep -q '^Categories=' /app/share/applications/com.tracelens.desktop.desktop || echo 'Categories=Science;Geoscience;Viewer;' >> /app/share/applications/com.tracelens.desktop.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/tracelens.png /app/share/icons/hicolor/128x128/apps/com.tracelens.desktop.png
      - install -Dm644 com.tracelens.desktop.metainfo.xml /app/share/metainfo/com.tracelens.desktop.metainfo.xml
      # The desktop file's MimeType= only associates an existing type; without a
      # shared-mime-info package nothing maps *.segy / *.sgy to
      # application/x-segy, so "Open With TraceLens" never appears.
      - install -Dm644 com.tracelens.desktop.mime.xml /app/share/mime/packages/com.tracelens.desktop.xml
      # Best-effort: the host merges /app/share/mime at runtime via XDG_DATA_DIRS,
      # so a missing update-mime-database in the SDK is not fatal.
      - update-mime-database /app/share/mime || true
